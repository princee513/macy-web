<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>福岡六天五夜・行程規劃器</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ea; --card:#ffffff; --ink:#272420; --muted:#8f887b; --border:#e8e2d6;
    --accent:#e2704a; --accent-dark:#cf5c38;
    --grad:linear-gradient(135deg,#f0975c 0%,#e2704a 100%);
    --warn:#c0392b;
    --shadow:0 1px 3px rgba(40,32,20,.06),0 4px 16px rgba(40,32,20,.06);
    --shadow-lg:0 8px 32px rgba(40,32,20,.16);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:'Noto Sans TC',system-ui,-apple-system,'Microsoft JhengHei',sans-serif;
       color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}

  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#d6cfc0;border-radius:99px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------------- 頂部列 ---------------- */
  header{height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;flex-shrink:0;
         background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
         position:relative;z-index:30}
  .logo{width:35px;height:35px;border-radius:11px;background:var(--grad);color:#fff;font-size:18px;
        display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(226,112,74,.4);flex-shrink:0}
  header h1{font-size:16.5px;margin:0;font-weight:900;letter-spacing:.3px}
  header .sub{font-size:11px;color:var(--muted);margin-top:1px;letter-spacing:.5px}
  header .spacer{flex:1}
  #tripTotal{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--border);
             border-radius:999px;padding:5px 14px;white-space:nowrap}
  #tripTotal b{color:var(--accent);font-weight:700}

  /* ---------------- 天數列 ---------------- */
  #dayBar{display:flex;gap:8px;padding:10px 16px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
          border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;scrollbar-width:thin}
  .tab{flex-shrink:0;display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:#fff;
       border-radius:14px;padding:7px 14px;cursor:pointer;font-family:inherit;color:var(--ink);
       transition:all .15s;box-shadow:0 1px 2px rgba(40,32,20,.04)}
  .tab:hover{border-color:var(--accent);transform:translateY(-1px)}
  .tab .t-day{font-size:9.5px;letter-spacing:1.2px;font-weight:700;color:var(--muted)}
  .tab .t-name{font-size:13px;font-weight:700}
  .tab .cnt{font-size:10.5px;background:#f1ece2;border-radius:999px;padding:1px 8px;color:var(--muted);font-weight:600}
  .tab.active{background:var(--grad);border-color:transparent;box-shadow:0 3px 12px rgba(226,112,74,.4)}
  .tab.active .t-day,.tab.active .t-name,.tab.active .cnt{color:#fff}
  .tab.active .cnt{background:rgba(255,255,255,.25)}

  /* ---------------- 資料來源提示列 ---------------- */
  #srcBar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#fff8e6;
          border-bottom:1px solid #eadfc0;font-size:12.5px;color:#7a6a3a;flex-wrap:wrap}
  #srcBar[hidden]{display:none}
  #srcBar .btn{flex-shrink:0}

  /* ---------------- 主體布局 ---------------- */
  #main{flex:1;display:flex;overflow:hidden;min-height:0}
  #sidebar{width:var(--sidebar-w,470px);min-width:320px;max-width:70vw;overflow-y:auto;
           background:var(--bg);flex-shrink:0}
  #splitter{width:7px;flex-shrink:0;cursor:col-resize;position:relative;z-index:10;transition:background .15s}
  #splitter:hover,#splitter.dragging{background:rgba(226,112,74,.35)}
  #splitter::after{content:'';position:absolute;top:50%;left:2px;width:3px;height:36px;transform:translateY(-50%);
                   border-radius:2px;background:var(--border)}
  #mapWrap{flex:1;position:relative;min-width:0}
  #map{height:100%;width:100%}

  /* ---------------- 單日標頭 ---------------- */
  .day-head{padding:16px 18px 6px}
  .day-name{width:100%;font-size:21px;font-weight:900;border:none;background:transparent;padding:2px 0;
            font-family:inherit;color:var(--ink);border-bottom:2px dashed transparent;outline:none}
  .day-name:focus{border-bottom-color:var(--accent)}
  .day-sub{display:flex;gap:8px;align-items:center;margin:8px 0 6px;flex-wrap:wrap}
  .day-sub input[type=date]{border:1px solid var(--border);border-radius:9px;padding:5px 9px;
                            font-family:inherit;font-size:13px;background:#fff;color:var(--ink)}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
  .chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--border);
        border-radius:999px;padding:4.5px 13px;font-size:12.5px;color:var(--muted);box-shadow:0 1px 2px rgba(40,32,20,.04)}
  .chip b{color:var(--accent);font-weight:700}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 4px}
  .day-notes{display:block;width:calc(100% - 36px);margin:8px 18px 4px;border:1px solid var(--border);border-radius:11px;
             padding:9px 12px;font-family:inherit;font-size:13px;resize:vertical;min-height:46px;background:#fff;
             color:var(--ink);line-height:1.6}
  .day-notes::placeholder{color:#bab3a4}
  .day-notes:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(226,112,74,.14)}

  /* ---------------- 按鈕 ---------------- */
  .btn{border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:10px;padding:7.5px 14px;
       font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;box-shadow:0 1px 2px rgba(40,32,20,.05)}
  .btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .btn.primary{background:var(--grad);border:none;color:#fff;font-weight:700;
               box-shadow:0 3px 10px rgba(226,112,74,.35)}
  .btn.primary:hover{color:#fff;filter:brightness(1.05);transform:translateY(-1px)}
  .btn.mini{padding:4px 10px;font-size:12px;border-radius:8px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ---------------- 行程卡（時間軸風格） ---------------- */
  #stopList{list-style:none;margin:0;padding:6px 18px 8px}
  #stopList li{position:relative}
  #stopList li.drag-ghost{opacity:.35}
  #stopList li.drop-above::before,#stopList li.drop-below::after{
    content:'';position:absolute;left:14px;right:14px;height:0;border-top:3px dashed var(--accent);z-index:2}
  #stopList li.drop-above::before{top:-2px}
  #stopList li.drop-below::after{bottom:-2px}
  .empty{color:var(--muted);font-size:14px;padding:30px 10px;text-align:center;line-height:1.8}

  .card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);
        border-radius:13px;padding:11px 13px;box-shadow:var(--shadow);cursor:pointer;margin:6px 0;
        transition:box-shadow .18s,transform .18s}
  .card:hover{box-shadow:0 4px 18px rgba(40,32,20,.12);transform:translateY(-1px)}
  .card.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(226,112,74,.2),var(--shadow)}
  .card-top{display:flex;align-items:center;gap:9px}
  .handle{cursor:grab;color:#c8c1b1;font-size:14px;user-select:none;flex-shrink:0}
  .num{flex-shrink:0;width:23px;height:23px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;
       display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.18)}
  .cname{font-weight:700;font-size:14.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .time-chip{flex-shrink:0;font-size:12px;color:var(--muted);background:var(--bg);border-radius:7px;padding:2.5px 9px;font-weight:600}
  .card-mid{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;flex-direction:column;gap:2.5px}
  .card-notes{font-size:12.5px;color:#6d6a62;margin-top:6px;background:#faf6ee;border-radius:8px;padding:6px 10px;
              white-space:pre-wrap;line-height:1.6}
  .warn-tag{color:var(--warn);font-size:12px;margin-top:5px;font-weight:600}
  .actions{display:flex;gap:5px;margin-top:8px}

  /* ---------------- 交通段 ---------------- */
  .leg{display:inline-flex;flex-wrap:wrap;align-items:center;gap:7px;margin:2px 0 2px 16px;max-width:calc(100% - 30px);
       background:#fff;border:1px dashed #d5ccba;border-radius:999px;padding:4.5px 13px;font-size:12px;
       color:var(--muted);cursor:pointer;transition:all .15s}
  .leg:hover{border-color:var(--accent);color:var(--ink);background:#fff8f4;box-shadow:0 2px 8px rgba(226,112,74,.12)}
  .leg .dash{color:var(--accent);font-weight:700}
  .leg .mode-pill{display:inline-flex;align-items:center;gap:4px;background:#f6efe6;border:none;
                  border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700;color:var(--ink)}
  .leg .leg-info{flex-basis:100%;padding-left:2px;line-height:1.5}
  .leg .leg-edit{margin-left:auto;opacity:0;font-size:11.5px;color:var(--accent);font-weight:700;transition:opacity .15s;white-space:nowrap}
  .leg:hover .leg-edit{opacity:1}

  /* ---------------- 候選口袋名單 ---------------- */
  .cand-head{display:flex;align-items:center;gap:8px;padding:18px 18px 3px;margin-top:6px;border-top:1px dashed var(--border)}
  .cand-title{font-weight:900;font-size:14px}
  .cand-tip{font-size:11.5px;color:var(--muted);padding:2px 18px 8px;line-height:1.6}
  #candList{padding:0 18px 10px;display:flex;flex-direction:column;gap:9px}
  .cand{display:flex;gap:10px;background:#fffdf7;border:1px dashed #d8d0bd;border-radius:13px;padding:10px 12px;
        transition:box-shadow .15s}
  .cand:hover{box-shadow:var(--shadow)}
  .cand-dot{width:25px;height:25px;border-radius:50%;background:#fff;border:2.5px solid;display:flex;
            align-items:center;justify-content:center;font-size:12.5px;flex-shrink:0}
  .cand-body{flex:1;min-width:0}
  .cand-name{font-weight:700;font-size:13.5px}
  .cand-sub{font-size:12px;color:var(--muted);margin-top:2px;display:flex;flex-direction:column;gap:1.5px}
  .cand-notes{font-size:12px;color:#6d6a62;margin-top:5px;background:#faf6ee;border-radius:8px;padding:5px 9px;white-space:pre-wrap}
  .cand-act{display:flex;gap:5px;margin-top:8px}
  .cand-empty{color:var(--muted);font-size:12.5px;padding:2px 2px 4px}
  .side-foot{font-size:11.5px;color:var(--muted);padding:6px 20px 24px;line-height:1.8}

  /* ---------------- 地圖控制 ---------------- */
  .base-switch{position:absolute;top:12px;right:12px;z-index:600;display:flex;gap:2px;
               background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border:1px solid rgba(40,32,20,.08);
               border-radius:999px;padding:4px;box-shadow:0 3px 14px rgba(40,32,20,.14)}
  .base-switch button{border:none;background:transparent;color:var(--ink);border-radius:999px;
      padding:5px 13px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s;white-space:nowrap}
  .base-switch button:hover{background:rgba(226,112,74,.12)}
  .base-switch button.active{background:var(--grad);color:#fff}
  .map-tip{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:500;
           background:rgba(35,30,24,.88);backdrop-filter:blur(6px);color:#fff;font-size:13px;
           padding:9px 18px;border-radius:999px;pointer-events:none;display:none;box-shadow:var(--shadow-lg)}
  .map-tip.show{display:block}
  #map.pick-mode{cursor:crosshair}

  .num-pin,.cand-pin{background:none;border:none}
  .pin-dot{width:26px;height:26px;border-radius:50%;color:#fff;font-size:12.5px;font-weight:700;
           display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;
           box-shadow:0 2px 7px rgba(0,0,0,.35);transition:transform .15s}
  .pin-dot.sel{transform:scale(1.3);box-shadow:0 0 0 3px rgba(226,112,74,.5),0 2px 7px rgba(0,0,0,.35)}

  /* ---------------- 彈窗 ---------------- */
  .backdrop{position:fixed;inset:0;background:rgba(30,26,20,.48);backdrop-filter:blur(3px);
            display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
  .backdrop[hidden]{display:none}
  .modal{background:#fff;border-radius:18px;width:min(580px,94vw);max-height:92vh;overflow-y:auto;
         padding:22px 24px;box-shadow:var(--shadow-lg);animation:pop .18s ease}
  @keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
  .modal h2{margin:0 0 16px;font-size:17px;font-weight:900}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 12px;
      font-family:inherit;font-size:14px;background:#fff;color:var(--ink);transition:all .15s}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(226,112,74,.14)}
  .field textarea{resize:vertical;min-height:58px;line-height:1.6}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .search-box{position:relative}
  .results{border:1px solid var(--border);border-radius:11px;margin-top:6px;overflow:hidden;max-height:190px;overflow-y:auto;
           box-shadow:var(--shadow)}
  .results button{display:block;width:100%;text-align:left;background:#fff;border:none;border-bottom:1px solid var(--border);
      padding:9px 12px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink);line-height:1.45}
  .results button:hover{background:#fdf2ec}
  .results button b{display:block;font-size:13.5px}
  .results button span{color:var(--muted);font-size:12px}
  .picked-line{font-size:13px;background:#eef8f3;border:1px solid #cfe9dd;border-radius:9px;padding:8px 12px;margin-top:6px}
  #coordLine{background:#f6f1e7;border:1px dashed #ddd3bd;color:var(--muted);font-size:12px}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

  #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(90px);background:rgba(35,30,24,.92);
         backdrop-filter:blur(6px);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;z-index:2000;
         transition:transform .28s;max-width:88vw;box-shadow:var(--shadow-lg)}
  #toast.show{transform:translateX(-50%) translateY(0)}

  /* ================= 手機／窄螢幕：行程・地圖 分頁切換 ================= */
  #viewBar{display:none}
  .map-fab{display:none}
  @media (max-width:900px){
    #splitter{display:none}
    #tripTotal{display:none}
    header{height:54px;padding:0 14px}
    header h1{font-size:14.5px}
    header .sub{display:none}

    /* 行程表與地圖各自全螢幕，用底部分頁切換 */
    #main{position:relative;overflow:hidden}
    #sidebar{position:absolute;inset:0;width:100%!important;max-width:100%;flex:none;
             overflow-y:auto;-webkit-overflow-scrolling:touch;
             padding-bottom:calc(80px + env(safe-area-inset-bottom))}
    #mapWrap{position:absolute;inset:0;height:auto;flex:none}
    body.view-plan #mapWrap{visibility:hidden}
    body.view-map #sidebar{visibility:hidden}

    #dayBar{padding:10px 12px;gap:8px;-webkit-overflow-scrolling:touch}
    .tab{padding:9px 14px}
    .day-head{padding:14px 16px 6px}
    .day-name{font-size:20px}
    .toolbar{padding:0 16px 4px}
    .day-notes{width:calc(100% - 32px);margin:8px 16px 4px}
    #stopList{padding:6px 16px 8px}
    .btn{padding:9px 15px;min-height:40px}
    .btn.mini{padding:7px 12px;min-height:34px}
    .cand-head{padding-left:16px;padding-right:16px}
    .cand-tip{padding-left:16px;padding-right:16px}
    #candList{padding:0 16px 10px}
    /* 16px 防 iOS 聚焦時自動放大 */
    .field input,.field select,.field textarea,.day-notes,
    .day-sub input[type=date]{font-size:16px}

    .base-switch{top:10px;right:10px}
    .base-switch button{padding:8px 14px;font-size:13px}

    /* 底部分頁切換列 */
    #viewBar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:900;justify-content:center;
             padding:10px 14px calc(10px + env(safe-area-inset-bottom));pointer-events:none;
             background:linear-gradient(to top,rgba(244,241,234,.97) 55%,rgba(244,241,234,0))}
    #viewSwitch{display:flex;pointer-events:auto;background:#fff;border:1px solid var(--border);
                border-radius:999px;padding:4px;box-shadow:var(--shadow-lg)}
    #viewSwitch button{border:none;background:transparent;font-family:inherit;font-size:14.5px;font-weight:700;
                color:var(--muted);padding:11px 30px;border-radius:999px;cursor:pointer;transition:all .15s}
    #viewSwitch button.active{background:var(--grad);color:#fff;box-shadow:0 3px 10px rgba(226,112,74,.4)}

    /* 地圖上的浮動按鈕 */
    body.view-map .map-fab{display:flex;position:absolute;right:14px;z-index:600;width:48px;height:48px;
        border-radius:50%;align-items:center;justify-content:center;font-size:20px;font-family:inherit;
        background:#fff;border:1px solid var(--border);box-shadow:var(--shadow-lg);cursor:pointer;
        transition:transform .15s}
    body.view-map .map-fab:active{transform:scale(.92)}
    #btnPickM{bottom:calc(96px + env(safe-area-inset-bottom))}
    #btnFitM{bottom:calc(152px + env(safe-area-inset-bottom))}
    #btnPickM.primary{background:var(--grad);color:#fff;border-color:transparent}

    .map-tip{bottom:calc(104px + env(safe-area-inset-bottom));font-size:13px;text-align:center;max-width:86vw}
    #toast{bottom:calc(94px + env(safe-area-inset-bottom))}

    /* 彈窗改由底部滑出 */
    .backdrop{padding:0;align-items:flex-end}
    .modal{width:100vw;max-height:90vh;border-radius:20px 20px 0 0;
           padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>

<header>
  <div class="logo">✈</div>
  <div>
    <h1>福岡六天五夜・行程規劃器</h1>
    <div class="sub">FUKUOKA TRIP PLANNER</div>
  </div>
  <span class="spacer"></span>
  <span id="tripTotal"></span>
</header>

<nav id="dayBar"></nav>

<div id="srcBar" hidden>
  <span id="srcMsg"></span>
  <span style="flex:1"></span>
  <button class="btn mini" id="btnUsePub">📄 載入發布版</button>
  <button class="btn mini" id="btnSrcDismiss">✕</button>
</div>

<main id="main">
  <aside id="sidebar">
    <div class="day-head">
      <input class="day-name" id="dayName" placeholder="第 N 天">
      <div class="day-sub">
        <input type="date" id="dayDate" title="日期">
        <button class="btn mini" id="btnSortTime" title="依開始時間排序">⇅ 依時間排序</button>
        <button class="btn mini" id="btnClearDay" title="清空本日行程">🗑 清空這天</button>
      </div>
      <div class="meta" id="dayMeta"></div>
      <div class="toolbar">
        <button class="btn primary" id="btnAdd">＋ 新增景點</button>
        <button class="btn" id="btnPick">📍 地圖點選</button>
        <button class="btn" id="btnFit" title="縮放地圖以顯示本日全部地點">🎯 顯示全日路線</button>
      </div>
    </div>
    <textarea class="day-notes" id="dayNotes" rows="2" placeholder="本日備註（住宿飯店、交通票券、天氣提醒…）"></textarea>
    <ol id="stopList"></ol>
    <div class="cand-head">
      <span class="cand-title">📋 候選口袋名單</span>
      <span style="flex:1"></span>
      <button class="btn mini" id="btnAddCand">＋ 加入候選</button>
    </div>
    <div class="cand-tip">查好但還沒定案的店家放這裡，不會算進路線；決定了再「轉為行程」。也會顯示在地圖上（白底圓點）。</div>
    <div id="candList"></div>
    <div class="side-foot">
      ⚠️ 範例景點的座標與營業時間僅供參考，請以地圖搜尋與官方公告為準。<br>
      行程來源：<b>fukuoka-itinerary.json</b>（與網頁一起發布）。
    </div>
  </aside>

  <div id="splitter" title="拖曳調整側邊欄寬度"></div>

  <div id="mapWrap">
    <div id="map"></div>
    <div class="base-switch" id="baseSwitch"></div>

/* ================= 狀態 ================= */
let state=null;
let currentDay=0;
let selectedStopId=null;
let pickMode=false;
let modalCtx=null;
let markers=[];
let fitPending=true;

function normalize(s){
  s.version=3;
  s.days.forEach(d=>{
    if(!Array.isArray(d.cands)) d.cands=[];
    if(typeof d.notes!=='string') d.notes='';
    d.stops.forEach(st=>{ if(st.transit&&typeof st.transit==='string') st.transit={mode:'other',info:st.transit}; });
  });
}

function init(){
  // 資料來源優先序：
  //  1. fukuoka-itinerary.json（跟網頁放在一起的發布版，靜態 hosting 上所有人都能看到）
  //  2. localStorage（本機瀏覽時的個人暫存修改）
  //  3. 內建範例
  fetch('fukuoka-itinerary.json',{cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(pub=>{
      if(!pub || !Array.isArray(pub.days) || !pub.days.length) throw new Error('bad');
      const raw=localStorage.getItem(LS_KEY);
      if(raw){
        try{
          const ls=JSON.parse(raw);
          if(ls && Array.isArray(ls.days) && ls.days.length && JSON.stringify(ls)!==JSON.stringify(pub)){
            showSrcBar('顯示的是你上次編輯的內容（存在此瀏覽器）；發布版（fukuoka-itinerary.json）內容不同。');
          }
        }catch(e){}
      }
      applyState(pub);
    })
    .catch(()=>{
      let s=null;
      try{
        const raw=localStorage.getItem(LS_KEY);
        if(raw){
          const ls=JSON.parse(raw);
          if(ls && Array.isArray(ls.days) && ls.days.length){
            if(!ls.version || ls.version<3){
              if(ls.days.length>=5){ const t=ls.days[1]; ls.days[1]=ls.days[4]; ls.days[4]=t; }
              ls.version=3;
            }
            s=ls;
          }
        }
      }catch(e){}
      if(!s) s=seedData();
      applyState(s);
    });
}
function applyState(s){
  if(!s.version || s.version<3){
    if(s.days.length>=5){ const t=s.days[1]; s.days[1]=s.days[4]; s.days[4]=t; }
    s.version=3;
  }
  normalize(s);
  state=s;
  renderAll();
  save();
}

function showSrcBar(msg){
  $('srcMsg').textContent=msg;
  $('srcBar').hidden=false;
}
$('btnSrcDismiss').onclick=()=>{ $('srcBar').hidden=true; };
$('btnUsePub').onclick=()=>{
  fetch('fukuoka-itinerary.json',{cache:'no-store'})
    .then(r=>r.json())
    .then(pub=>{
      if(!confirm('放棄此瀏覽器上的修改，載入發布版行程？')) return;
      localStorage.removeItem(LS_KEY);
      applyState(pub);
      $('srcBar').hidden=true;
      toast('已載入發布版行程');
    })
    .catch(()=>toast('讀取發布版失敗'));
};

function save(){
  if(!state) return;
  try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }
  catch(e){ toast('⚠️ 儲存失敗（瀏覽器空間不足？）'); }
}
function day(){ return state.days[currentDay]; }

/* ================= 小工具 ================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function havKm(a,b){
  const R=6371000,r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x))/1000;
}
function fmtKm(km){ return km<1?Math.round(km*1000)+' m':km.toFixed(1)+' km'; }
function fmtMin(m){ m=Math.round(m); if(m<60) return m+' 分'; const h=Math.floor(m/60); return h+' 小時 '+(m%60)+' 分'; }
function transitAutoMinutes(mode,km){
  const m=TRANSIT_MODES[mode]||TRANSIT_MODES.other;
  return (km/m.speedKmh)*60+(mode==='walk'?0:6);
}
let toastTimer=null;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3200);
}

const BASE_KEY='fukuoka-trip-basemap';
let baseLayer=null;
function setBasemap(key){
  const cfg=BASEMAPS[key]; if(!cfg) return;
  try{ localStorage.setItem(BASE_KEY,key); }catch(e){}
  if(baseLayer) map.removeLayer(baseLayer);
  baseLayer=L.tileLayer(cfg.url,{maxZoom:cfg.maxZoom,attribution:cfg.attr});
  baseLayer.on('tileerror',()=>{
    if(!baseLayer._fellBack){
      baseLayer._fellBack=true;
      toast('此圖磚來源載入失敗，自動切換…');
      const keys=Object.keys(BASEMAPS);
      const next=keys[(keys.indexOf(key)+1)%keys.length];
      setBasemap(next);
    }
  });
  baseLayer.addTo(map);
  document.querySelectorAll('#baseSwitch button').forEach(b=>b.classList.toggle('active',b.dataset.key===key));
}

const overlay=L.layerGroup().addTo(map);

/* ================= 路線計算（直線 × 交通方式繞行係數） ================= */
function legKm(di,i){
  const d=state.days[di];
  const straight=havKm(d.stops[i],d.stops[i+1]);
  const tr=d.stops[i+1].transit;
  const m=TRANSIT_MODES[tr?tr.mode:'walk']||TRANSIT_MODES.other;
  return straight*m.detour;
}
function dayStats(di){
  const d=state.days[di];
  let km=0,min=0;
  for(let i=0;i<d.stops.length-1;i++){
    const kmI=legKm(di,i);
    km+=kmI;
    const tr=d.stops[i+1].transit;
    min+=(tr&&tr.min!=null&&tr.min!==''&&isFinite(+tr.min))?+tr.min:transitAutoMinutes(tr?tr.mode:'walk',kmI);
  }
  return {km,min,n:d.stops.length};
}

/* ================= 渲染 ================= */
function renderTabs(){
  const box=$('dayBar'); box.innerHTML='';
  state.days.forEach((d,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===currentDay?' active':'');
    b.innerHTML='<span class="t-day">DAY '+(i+1)+'</span><span class="t-name">'+(d.name?esc(d.name):'')+'</span>'
      +'<span class="cnt">'+d.stops.length+'</span>';
    if(d.date) b.title=d.date;
    b.onclick=()=>switchDay(i);
    box.appendChild(b);
  });
  const total=state.days.reduce((a,d)=>a+d.stops.length,0);
  $('tripTotal').innerHTML='🗺 '+state.days.length+' 天 ・ <b>'+total+'</b> 個地點';
}
function switchDay(i){
  if(i===currentDay) return;
  currentDay=i; selectedStopId=null; setPickMode(false);
  fitPending=true;
  renderAll();
}

function renderDay(){
  const d=day();
  $('dayName').value=d.name;
  $('dayDate').value=d.date||'';
  $('dayNotes').value=d.notes||'';

  const st=dayStats(currentDay);
  $('dayMeta').innerHTML=st.n===0
    ?'<span class="chip">尚無行程，點「＋ 新增景點」或「📍 地圖點選」開始安排</span>'
    :'<span class="chip">📍 <b>'+st.n+'</b> 個地點</span>'
     +'<span class="chip">📏 總距離約 <b>'+fmtKm(st.km)+'</b></span>'
     +'<span class="chip">⏱ 移動約 <b>'+fmtMin(st.min)+'</b></span>';

  const list=$('stopList'); list.innerHTML='';
  if(d.stops.length===0){
    list.innerHTML='<div class="empty">這天還沒有行程 🏖️<br>用地圖搜尋或直接點地圖來新增吧！</div>';
  }
  d.stops.forEach((s,i)=>{
    const li=document.createElement('li'); li.dataset.id=s.id;

    if(i>0){
      const tr=s.transit||{mode:'walk'};
      const tm=TRANSIT_MODES[tr.mode]||TRANSIT_MODES.other;
      const km=legKm(currentDay,i-1);
      const min=(tr.min!=null&&tr.min!==''&&isFinite(+tr.min))?+tr.min:transitAutoMinutes(tr.mode,km);
      const legDiv=document.createElement('div'); legDiv.className='leg';
      legDiv.title='點擊編輯這段交通';
      legDiv.innerHTML='<span class="dash">↳</span>'
        +'<span class="mode-pill">'+tm.label+'</span>'
        +'<span>'+fmtKm(km)+' ・ 約 '+fmtMin(min)+'</span>'
        +'<span class="leg-edit">✏️ 改</span>'
        +(tr.info?'<span class="leg-info">🚉 '+esc(tr.info)+'</span>':'');
      legDiv.addEventListener('click',()=>openLegModal(i));
      li.appendChild(legDiv);
    }

    const cat=CATS[s.cat]||CATS.other;
    const card=document.createElement('div');
    card.className='card'+(s.id===selectedStopId?' selected':'');
    card.style.borderLeftColor=cat.color;
    let html='<div class="card-top">'
      +'<span class="handle" title="拖曳排序">⠿</span>'
      +'<span class="num" style="background:'+cat.color+'">'+(i+1)+'</span>'
      +'<span class="cname">'+esc(s.name)+'</span>'
      +(s.startTime||s.endTime?'<span class="time-chip">🕐 '+esc(s.startTime||'?')+(s.endTime?'–'+esc(s.endTime):'')+'</span>':'')
      +'</div>';
    const mids=[];
    mids.push('<span>'+cat.label+'</span>');
    if(s.hours) mids.push('<span>🕒 '+esc(s.hours)+'</span>');
    if(s.addr) mids.push('<span>📍 '+esc(s.addr)+'</span>');
    if(!s.addr) mids.push('<span>📍 '+s.lat.toFixed(4)+', '+s.lng.toFixed(4)+'</span>');
    html+='<div class="card-mid">'+mids.join('')+'</div>';
    if(s.notes) html+='<div class="card-notes">📝 '+esc(s.notes)+'</div>';
    if(i>0){
      const prev=d.stops[i-1];
      if(prev.endTime&&s.startTime&&s.startTime<prev.endTime)
        html+='<div class="warn-tag">⚠️ 與上一個行程時間重疊</div>';
    }
    html+='<div class="actions">'
      +'<button class="btn mini" data-act="edit">✏️ 編輯</button>'
      +'<button class="btn mini" data-act="del">🗑 刪除</button>'
      +'<span style="flex:1"></span>'
      +'<button class="btn mini" data-act="up" title="上移">▲</button>'
      +'<button class="btn mini" data-act="down" title="下移">▼</button>'
      +'</div>';
    card.innerHTML=html;
    card.addEventListener('click',e=>{
      if(e.target.closest('button')) return;
      selectStop(s.id,true);
    });
    const handle=card.querySelector('.handle');
    handle.addEventListener('mousedown',()=>{ li.draggable=true; });
    li.appendChild(card);
    list.appendChild(li);
  });
  renderTabs();
  renderCands();
}
document.addEventListener('mouseup',()=>{
  document.querySelectorAll('#stopList li').forEach(li=>{ li.draggable=false; });
});

function renderCands(){
  const d=day(),box=$('candList'); box.innerHTML='';
  if(!d.cands.length){
    box.innerHTML='<div class="cand-empty">還沒有候選店家。查到不錯的店先加進來備用！</div>';
    return;
  }
  d.cands.forEach((cd,i)=>{
    const cat=CATS[cd.cat]||CATS.other;
    const el=document.createElement('div'); el.className='cand';
    el.innerHTML='<span class="cand-dot" style="border-color:'+cat.color+';color:'+cat.color+'" title="候選店家（地圖上白底圓點）">☆</span>'
      +'<div class="cand-body">'
      +'<div class="cand-name">'+esc(cd.name)+'</div>'
      +'<div class="cand-sub">'
      +'<span>'+cat.label+(cd.hours?' ・ 🕒 '+esc(cd.hours):'')+'</span>'
      +(cd.addr?'<span>📍 '+esc(cd.addr)+'</span>':'')
      +'</div>'
      +(cd.notes?'<div class="cand-notes">📝 '+esc(cd.notes)+'</div>':'')
      +'<div class="cand-act">'
      +'<button class="btn mini" data-act="promote" data-i="'+i+'" title="排進今天行程">⬆ 轉為行程</button>'
      +'<button class="btn mini" data-act="cedit" data-i="'+i+'">✏️</button>'
      +'<button class="btn mini" data-act="cdel" data-i="'+i+'">🗑</button>'
      +'</div></div>';
    box.appendChild(el);
  });
}

$('candList').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-act]'); if(!btn) return;
  const i=+btn.dataset.i,d=day();
  const act=btn.dataset.act;
  if(act==='cdel'){
    if(confirm('刪除候選「'+d.cands[i].name+'」？')){ d.cands.splice(i,1); renderCands(); renderMap(); save(); }
    return;
  }
  if(act==='cedit'){ openModal('cand-edit',null,d.cands[i].id); return; }
  if(act==='promote'){
    const cd=d.cands[i];
    const stop={id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
      name:cd.name,cat:cd.cat,startTime:'',endTime:'',hours:cd.hours,
      lat:cd.lat,lng:cd.lng,addr:cd.addr,notes:cd.notes,transit:null};
    d.stops.push(stop); d.cands.splice(i,1);
    renderAll();
    toast('已把「'+cd.name+'」排進今天行程，記得調整順序與時間');
  }
});
$('btnAddCand').onclick=()=>openModal('cand');

function renderMap(){
  overlay.clearLayers(); markers=[];
  const d=day();
  const pts=[];
  d.stops.forEach((s,i)=>{
    const cat=CATS[s.cat]||CATS.other;
    const icon=L.divIcon({
      className:'num-pin',
      html:'<div class="pin-dot'+(s.id===selectedStopId?' sel':'')+'" style="background:'+cat.color+'">'+(i+1)+'</div>',
      iconSize:[26,26],iconAnchor:[13,13]
    });
    const m=L.marker([s.lat,s.lng],{icon,zIndexOffset:s.id===selectedStopId?1000:0}).addTo(overlay);
    m.bindPopup('<b>'+esc(s.name)+'</b>'+(s.hours?'<br>🕒 '+esc(s.hours):'')+(s.addr?'<br>📍 '+esc(s.addr):''));
    m.on('click',()=>selectStop(s.id,false));
    markers.push(m);
    pts.push([s.lat,s.lng]);
  });
  d.cands.forEach(cd=>{
    const cat=CATS[cd.cat]||CATS.other;
    const icon=L.divIcon({
      className:'cand-pin',
      html:'<div class="pin-dot cand-dot" style="background:#fff;border-color:'+cat.color+';color:'+cat.color+'">☆</div>',
      iconSize:[24,24],iconAnchor:[12,12]
    });
    const m=L.marker([cd.lat,cd.lng],{icon,zIndexOffset:-500}).addTo(overlay);
    m.bindPopup('<b>☆ 候選：'+esc(cd.name)+'</b>'+(cd.hours?'<br>🕒 '+esc(cd.hours):'')+(cd.addr?'<br>📍 '+esc(cd.addr):'')+'<br><i>在候選名單中，未排入行程</i>');
    markers.push(m);
  });
  if(d.stops.length>1){
    for(let i=0;i<d.stops.length-1;i++){
      const tr=d.stops[i+1].transit||{mode:'walk'};
      const tm=TRANSIT_MODES[tr.mode]||TRANSIT_MODES.other;
      L.polyline([[d.stops[i].lat,d.stops[i].lng],[d.stops[i+1].lat,d.stops[i+1].lng]],
        {color:tm.color,weight:tm.dash?3:4,opacity:.85,dashArray:tm.dash}).addTo(overlay);
    }
  }
  if(fitPending&&pts.length){
    fitPending=false;
    map.fitBounds(L.latLngBounds(pts),{padding:[55,55],maxZoom:15});
  }
}

function renderAll(){ renderDay(); renderMap(); save(); }

function selectStop(id,fly){
  selectedStopId=id;
  renderDay(); renderMap();
  if(fly){
    const m=markers[day().stops.findIndex(s=>s.id===id)];
    if(m){ map.flyTo(m.getLatLng(),Math.max(map.getZoom(),14)); m.openPopup(); }
  }
}

/* ================= 新增／編輯彈窗 ================= */
function openModal(mode,stopId,candId){
  const d=day();
  modalCtx={mode,stopId:stopId||null,candId:candId||null,dayIdx:currentDay,picked:null};
  const isCand=mode==='cand'||mode==='cand-edit';
  $('modalTitle').textContent=mode==='add'?'新增景點 ・ 第'+(currentDay+1)+'天'
    :mode==='cand'?'加入候選口袋名單 ・ 第'+(currentDay+1)+'天'
    :mode==='cand-edit'?'編輯候選店家':'編輯景點';
  $('searchInput').value=''; $('results').hidden=true; $('pickedLine').hidden=true; $('coordLine').hidden=true;
  $('fCat').innerHTML=Object.entries(CATS).map(([k,v])=>'<option value="'+k+'">'+v.label+'</option>').join('');
  $('fMoveField').hidden=isCand;
  $('fStart').closest('.field').hidden=isCand;
  $('fEnd').closest('.field').hidden=isCand;
  $('fMove').innerHTML='<option value="'+currentDay+'">留在第'+(currentDay+1)+'天</option>'
    +state.days.map((dd,i)=>i===currentDay?'':'<option value="'+i+'">移到第'+(i+1)+'天'+(dd.name?'（'+esc(dd.name)+'）':'')+'</option>').join('');
  if(mode==='edit'){
    const s=d.stops.find(x=>x.id===stopId); if(!s) return;
    $('fName').value=s.name; $('fCat').value=s.cat; $('fStart').value=s.startTime||'';
    $('fEnd').value=s.endTime||''; $('fHours').value=s.hours||''; $('fAddr').value=s.addr||'';
    modalCtx.picked={lat:s.lat,lng:s.lng};
    showCoords(s.lat,s.lng);
    $('fNotes').value=s.notes||'';
  }else if(isCand){
    let cd=null;
    if(mode==='cand-edit') cd=d.cands.find(x=>x.id===candId);
    if(cd){
      $('fName').value=cd.name; $('fCat').value=cd.cat; $('fHours').value=cd.hours||'';
      $('fAddr').value=cd.addr||''; modalCtx.picked={lat:cd.lat,lng:cd.lng};
      showCoords(cd.lat,cd.lng);
      $('fNotes').value=cd.notes||'';
    }else{
      $('fName').value=''; $('fCat').value='food'; $('fHours').value='';
      $('fAddr').value=''; $('fNotes').value='';
    }
  }else{
    $('fName').value=''; $('fStart').value=''; $('fEnd').value=''; $('fHours').value='';
    $('fAddr').value=''; $('fNotes').value='';
  }
  $('backdrop').hidden=false;
  setTimeout(()=>$('searchInput').focus(),50);
}
function closeModal(){ $('backdrop').hidden=true; modalCtx=null; }

function showCoords(lat,lng){
  $('coordLine').textContent='📍 座標：'+lat.toFixed(5)+', '+lng.toFixed(5);
  $('coordLine').hidden=false;
}
function setPicked(p){
  modalCtx.picked={lat:p.lat,lng:p.lng};
  if(p.addr) $('fAddr').value=p.addr;
  if(p.name&&!$('fName').value) $('fName').value=p.name;
  showCoords(p.lat,p.lng);
  if(p.addr){
    $('pickedLine').textContent='已選擇：'+p.addr;
    $('pickedLine').hidden=false;
  }
}

$('btnSave').onclick=()=>{
  if(!modalCtx) return;
  const name=$('fName').value.trim();
  if(!name){ $('fName').focus(); toast('請填寫名稱'); return; }
  const lat=modalCtx.picked?modalCtx.picked.lat:NaN,lng=modalCtx.picked?modalCtx.picked.lng:NaN;
  if(!isFinite(lat)||!isFinite(lng)){ toast('請先用「搜尋」或「地圖點選」設定位置'); return; }
  const mode=modalCtx.mode;
  if(mode==='cand'||mode==='cand-edit'){
    const d=state.days[modalCtx.dayIdx];
    const data={name,cat:$('fCat').value,hours:$('fHours').value.trim(),
      addr:$('fAddr').value.trim(),lat,lng,notes:$('fNotes').value.trim()};
    if(mode==='cand'){
      d.cands.push(Object.assign({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)},data));
    }else{
      const cd=d.cands.find(x=>x.id===modalCtx.candId);
      if(cd) Object.assign(cd,data);
    }
    closeModal(); renderCands(); renderMap(); save();
    return;
  }
  const data={
    name,cat:$('fCat').value,
    startTime:$('fStart').value,endTime:$('fEnd').value,
    hours:$('fHours').value.trim(),addr:$('fAddr').value.trim(),
    lat,lng,notes:$('fNotes').value.trim()
  };
  const targetDay=parseInt($('fMove').value,10);
  if(mode==='add'){
    state.days[targetDay].stops.push(Object.assign({id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)},data));
    if(targetDay!==currentDay) toast('已加入第'+(targetDay+1)+'天');
  }else{
    const d=state.days[modalCtx.dayIdx];
    const idx=d.stops.findIndex(x=>x.id===modalCtx.stopId);
    if(idx>=0){
      const [moved]=d.stops.splice(idx,1);
      state.days[targetDay].stops.push(Object.assign(moved,data));
    }
  }
  closeModal();
  if(targetDay!==currentDay){ currentDay=targetDay; selectedStopId=null; fitPending=true; }
  renderAll();
};
$('btnCancel').onclick=closeModal;
$('backdrop').addEventListener('click',e=>{ if(e.target===$('backdrop')) closeModal(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    const leg=document.getElementById('legBackdrop');
    if(leg){ leg.remove(); return; }
    if(!$('backdrop').hidden) closeModal();
  }
});

/* 搜尋（Nominatim） */
let searchTimer=null;
$('searchInput').addEventListener('input',()=>{
  clearTimeout(searchTimer);
  const q=$('searchInput').value.trim();
  if(q.length<2){ $('results').hidden=true; return; }
  searchTimer=setTimeout(()=>doSearch(q),450);
});
async function doSearch(q){
  const box=$('results');
  box.innerHTML='<button disabled>搜尋中…</button>'; box.hidden=false;
  try{
    const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=zh-TW&q='+encodeURIComponent(q);
    const r=await fetch(url); const j=await r.json();
    if(!j.length){ box.innerHTML='<button disabled>找不到結果，試試別的關鍵字</button>'; return; }
    box.innerHTML='';
    j.forEach(item=>{
      const b=document.createElement('button');
      const parts=item.display_name.split(',');
      b.innerHTML='<b>'+esc(parts[0])+'</b><span>'+esc(parts.slice(1,4).join(','))+'</span>';
      b.onclick=()=>{
        box.hidden=true; $('searchInput').value=parts[0];
        setPicked({lat:parseFloat(item.lat),lng:parseFloat(item.lon),addr:item.display_name.split(',').slice(0,3).join(','),name:parts[0]});
      };
      box.appendChild(b);
    });
  }catch(e){
    box.innerHTML='<button disabled>搜尋失敗（網路問題），可改用「地圖點選」</button>';
  }
}

/* ================= 交通段編輯彈窗 ================= */
function openLegModal(stopIdx){
  const d=day(),s=d.stops[stopIdx],prev=d.stops[stopIdx-1];
  if(!s||!prev) return;
  const tr=s.transit||{mode:'walk',info:'',min:''};
  const km=legKm(currentDay,stopIdx-1);
  const auto=transitAutoMinutes(tr.mode,km);
  const bd=document.createElement('div'); bd.className='backdrop'; bd.id='legBackdrop';
  bd.innerHTML='<div class="modal" style="width:min(460px,94vw)">'
    +'<h2>🚏 交通：'+esc(prev.name)+' → '+esc(s.name)+'</h2>'
    +'<div class="field"><label>交通方式</label>'
    +'<select id="lgMode">'+Object.entries(TRANSIT_MODES).map(([k,v])=>'<option value="'+k+'"'+(k===tr.mode?' selected':'')+'>'+v.label+'</option>').join('')+'</select></div>'
    +'<div class="two"><div class="field"><label>移動距離</label><input id="lgKm" value="'+fmtKm(km)+'" disabled></div>'
    +'<div class="field"><label>耗時（分鐘，留空＝自動估計 '+Math.round(auto)+' 分）</label><input type="number" id="lgMin" min="0" step="1" value="'+(tr.min!=null?tr.min:'')+'" placeholder="自動"></div></div>'
    +'<div class="field"><label>交通資訊（路線、車站、票價、班次…）</label>'
    +'<textarea id="lgInfo" rows="3" placeholder="例：地鐵機場線 博多→中洲川端 3 分（¥200）；西鐵二日市轉車">'+esc(tr.info||'')+'</textarea></div>'
    +'<div class="modal-foot"><button class="btn" id="lgClear">清除這段</button><span style="flex:1"></span>'
    +'<button class="btn" id="lgCancel">取消</button><button class="btn primary" id="lgOk">儲存</button></div></div>';
  document.body.appendChild(bd);
  bd.addEventListener('click',e=>{ if(e.target===bd) bd.remove(); });
  bd.querySelector('#lgCancel').onclick=()=>bd.remove();
  bd.querySelector('#lgClear').onclick=()=>{ s.transit=null; bd.remove(); renderDay(); renderMap(); save(); };
  bd.querySelector('#lgOk').onclick=()=>{
    s.transit={mode:bd.querySelector('#lgMode').value,
      info:bd.querySelector('#lgInfo').value.trim(),
      min:bd.querySelector('#lgMin').value};
    bd.remove(); renderDay(); renderMap(); save();
  };
}

/* 地圖點選新增 */
function setPickMode(on){
  pickMode=on;
  $('btnPick').classList.toggle('primary',on);
  $('btnPick').textContent=on?'✖ 取消點選':'📍 地圖點選';
  if($('btnPickM')) $('btnPickM').classList.toggle('primary',on);
  $('mapTip').classList.toggle('show',on);
  $('map').classList.toggle('pick-mode',on);
}
map.on('click',async e=>{
  if(!pickMode) return;
  setPickMode(false);
  const latlng=e.latlng;
  toast('定位中…');
  let addr='',name='';
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=zh-TW&lat='+latlng.lat+'&lon='+latlng.lng);
    const j=await r.json();
    if(j&&j.display_name){ addr=j.display_name.split(',').slice(0,3).join(','); name=j.name||j.display_name.split(',')[0]; }
  }catch(err){}
  openModal('add');
  setPicked({lat:latlng.lat,lng:latlng.lng,addr,name});
});

/* 清單事件（刪除／上下移） */
$('stopList').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-act]'); if(!btn) return;
  const li=e.target.closest('li'); const id=li.dataset.id;
  const d=day(); const idx=d.stops.findIndex(s=>s.id===id); if(idx<0) return;
  const act=btn.dataset.act;
  if(act==='edit'){ openModal('edit',id); return; }
  if(act==='del'){
    if(!confirm('刪除「'+d.stops[idx].name+'」？')) return;
    d.stops.splice(idx,1); if(selectedStopId===id) selectedStopId=null;
    renderAll();
    return;
  }
  if(act==='up'&&idx>0){ [d.stops[idx-1],d.stops[idx]]=[d.stops[idx],d.stops[idx-1]]; }
  if(act==='down'&&idx<d.stops.length-1){ [d.stops[idx+1],d.stops[idx]]=[d.stops[idx],d.stops[idx+1]]; }
  if(act==='up'||act==='down'){ renderAll(); }
});

/* 拖曳排序 */
let dragId=null;
$('stopList').addEventListener('dragstart',e=>{
  const li=e.target.closest('li'); if(!li) return;
  dragId=li.dataset.id;
  e.dataTransfer.effectAllowed='move';
  try{ e.dataTransfer.setData('text/plain',dragId); }catch(err){}
  li.classList.add('drag-ghost');
});
$('stopList').addEventListener('dragend',()=>{
  dragId=null;
  document.querySelectorAll('#stopList li').forEach(li=>li.classList.remove('drag-ghost','drop-above','drop-below'));
});
$('stopList').addEventListener('dragover',e=>{
  e.preventDefault();
  const li=e.target.closest('li');
  document.querySelectorAll('#stopList li').forEach(x=>x.classList.remove('drop-above','drop-below'));
  if(!li) return;
  const r=li.getBoundingClientRect();
  const before=e.clientY<r.top+r.height/2;
  li.classList.add(before?'drop-above':'drop-below');
});
$('stopList').addEventListener('drop',e=>{
  e.preventDefault();
  const li=e.target.closest('li');
  if(!dragId) return;
  const d=day();
  const from=d.stops.findIndex(s=>s.id===dragId); if(from<0) return;
  let to;
  if(!li){ to=d.stops.length; }
  else{
    const r=li.getBoundingClientRect();
    const before=e.clientY<r.top+r.height/2;
    to=d.stops.findIndex(s=>s.id===li.dataset.id)+(before?0:1);
  }
  if(from<to) to--;
  const [moved]=d.stops.splice(from,1);
  d.stops.splice(to,0,moved);
  renderAll();
});

/* ================= 側欄寬度拖曳 ================= */
const SPLIT_KEY='fukuoka-trip-sidebar-w';
const sidebar=$('sidebar'),splitter=$('splitter');
let splitDrag=null;
try{
  const savedW=localStorage.getItem(SPLIT_KEY);
  if(savedW) sidebar.style.setProperty('--sidebar-w',savedW+'px');
}catch(e){}
splitter.addEventListener('pointerdown',e=>{
  splitDrag={startX:e.clientX,startW:sidebar.getBoundingClientRect().width};
  splitter.classList.add('dragging');
  splitter.setPointerCapture(e.pointerId);
  document.body.style.userSelect='none';
});
splitter.addEventListener('pointermove',e=>{
  if(!splitDrag) return;
  let w=splitDrag.startW+(e.clientX-splitDrag.startX);
  const maxW=window.innerWidth*0.7;
  w=Math.max(320,Math.min(maxW,w));
  sidebar.style.setProperty('--sidebar-w',w+'px');
  try{ localStorage.setItem(SPLIT_KEY,String(Math.round(w))); }catch(err){}
});
function endSplit(){
  if(!splitDrag) return;
  splitDrag=null;
  splitter.classList.remove('dragging');
  document.body.style.userSelect='';
  map.invalidateSize();
}
splitter.addEventListener('pointerup',endSplit);
splitter.addEventListener('pointercancel',endSplit);

/* ================= 手機／窄螢幕：行程・地圖分頁 ================= */
const mqMobile=window.matchMedia('(max-width:900px)');
function setView(v){
  document.body.classList.toggle('view-plan',v==='plan');
  document.body.classList.toggle('view-map',v==='map');
  $('vBtnPlan').classList.toggle('active',v==='plan');
  $('vBtnMap').classList.toggle('active',v==='map');
  if(v==='map') setTimeout(()=>map.invalidateSize(),60);
}
$('vBtnPlan').onclick=()=>setView('plan');
$('vBtnMap').onclick=()=>setView('map');
/* 手機上的地圖浮動按鈕 */
$('btnFitM').onclick=()=>{ const pts=day().stops.map(s=>[s.lat,s.lng]); if(pts.length) map.fitBounds(L.latLngBounds(pts),{padding:[55,55],maxZoom:15}); };
$('btnPickM').onclick=()=>setPickMode(!pickMode);
mqMobile.addEventListener('change',e=>{
  if(e.matches) setView('plan');
  else document.body.classList.remove('view-plan','view-map');
  map.invalidateSize();
});

/* ================= 啟動 ================= */
init();
if(mqMobile.matches) setView('plan');
</script>
